{% extends "base.html" %}
{% block content %}
<div class="space-y-4">
    <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm flex flex-wrap items-center justify-between gap-4">
        <div>
            <div class="text-xs font-semibold uppercase tracking-wider text-emerald-600">OFFICIAL OWASP CORE RULE SET (CRS v4.10.0)</div>
            <h1 class="text-xl font-bold text-slate-900 mt-1 font-mono">📄 {{ filename }}</h1>
            <p class="text-sm text-slate-600 mt-0.5">
                Official ModSecurity SecLang source rules directly loaded by <code class="font-mono text-xs bg-slate-100 px-1.5 py-0.5 rounded">coraza-waf.exe</code>.
            </p>
        </div>
        <a href="{{ url_for('waf_dashboard') }}" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs transition">
            ← Back to WAF Dashboard
        </a>
    </div>

    <div class="bg-slate-900 rounded-xl p-5 shadow-sm border border-slate-800 space-y-2">
        <div class="flex items-center justify-between text-xs font-mono text-slate-400 border-b border-slate-800 pb-2">
            <span>Location: <code class="text-emerald-400">./owasp-crs/rules/{{ filename }}</code></span>
            <span>Encoding: UTF-8</span>
        </div>
        <pre class="text-slate-200 text-xs font-mono overflow-x-auto p-2 leading-relaxed whitespace-pre-wrap">{{ content }}</pre>
    </div>
</div>
{% endblock %}
