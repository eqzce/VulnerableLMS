# ======================================================================
# OWASP CORAZA WAF — MODSECURITY SECLANG CONFIGURATION (AUTO-GENERATED)
# Active Mode: SecRuleEngine On | Active Paranoia Level: L1
# ======================================================================
SecRuleEngine On
SecRequestBodyAccess On
SecAuditEngine Off
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog c:/Users/Ersultan/Desktop/WebSec/moodle_portal/coraza_audit.log

# Whitelist WAF Admin Dashboard, Hints & Settings endpoints
SecRule REQUEST_URI "@rx ^/(waf-dashboard|waf/|settings/|hints|coraza-blocked)" "id:999,phase:1,pass,nolog,ctl:ruleEngine=Off"
# Only evaluate Access Control cookie/header rules (1003, 2003) on POST requests so GET page loads are never locked out by stale cookies
SecRule REQUEST_METHOD "@streq GET" "id:998,phase:1,pass,nolog,ctl:ruleRemoveById=1003,ctl:ruleRemoveById=2003"

# WAF-SQLI-BASIC (SQLi - L1)
SecRule ARGS "@rx (?i)(union\s+select|or\s+['\x22]?\d+['\x22]?\s*=\s*['\x22]?\d+|/\*\*/\s*or\s*/\*\*/|'and'1'='1|drop\s+table|--)" "id:1001,phase:2,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-SQLI-BASIC',tag:'SQLi',severity:'CRITICAL'"

# WAF-XSS-BASIC (XSS - L1)
SecRule ARGS "@rx (?i)(<\s*script\b|javascript\s*:|<\s*iframe\b|<\s*img\b|\bonerror\s*=|<\s*details\b|\bontoggle\s*=)" "id:1002,phase:2,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-XSS-BASIC',tag:'XSS',severity:'CRITICAL'"

# WAF-BAC-BASIC (Access Control - L1)
SecRule ARGS:is_admin|REQUEST_COOKIES:user_role|REQUEST_COOKIES:auth_token|REQUEST_COOKIES:vault_sig|REQUEST_HEADERS:X-Forwarded-For|REQUEST_HEADERS:X-Original-URL|ARGS:sim_exploit "@rx (^(true|TRUE|admin|ADMIN|low|medium|high)$|dXNlcj1hZG1pbg==|127\.0\.0\.1|/admin/vault|52c876f2a69205692536a1f2857b4e4c70312142b068e23f4d87d506680183c5)" "id:1003,phase:2,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-BAC-BASIC',tag:'Access Control',severity:'CRITICAL'"
