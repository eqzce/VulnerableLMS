# ======================================================================
# OWASP CORAZA WAF — OFFICIAL CORE RULE SET (CRS v4.10.0) CONFIGURATION
# Active Mode: SecRuleEngine Off | Active Paranoia Level: L1
# ======================================================================
SecRuleEngine Off
SecRequestBodyAccess On
SecResponseBodyAccess On
SecAuditEngine RelevantOnly
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog ./coraza_audit.log

# 1. Whitelist WAF Admin Dashboard, Hints, Settings & Blocked endpoints
SecRule REQUEST_URI "@rx ^/(waf-dashboard|waf/|settings/|hints|coraza-blocked|static/)" "id:999,phase:1,pass,nolog,ctl:ruleEngine=Off"

# 2. Local Lab Compatibility: Allow connecting via IP address 127.0.0.1 (disables rule 920350)
SecRuleRemoveById 920350

# 3. Configure Dynamic Paranoia Level for OWASP CRS
SecAction "id:900000,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.10.0',setvar:tx.blocking_paranoia_level=1"

# 4. Include Official OWASP ModSecurity Core Rule Set (CRS v4.10.0)
Include ./owasp-crs/crs-setup.conf
Include ./owasp-crs/rules/*.conf

# 5. University Virtual Patching Rules (Business Logic Protection)
# Only evaluate Access Control cookie/header rules on POST requests so GET page loads are never locked out by stale cookies
SecRule REQUEST_METHOD "@streq GET" "id:998,phase:1,pass,nolog,ctl:ruleRemoveById=1003,ctl:ruleRemoveById=2003"

# WAF-VAULT-BASIC (Access Control - L1)
SecRule ARGS:is_admin|REQUEST_COOKIES:user_role|REQUEST_COOKIES:auth_token|REQUEST_COOKIES:vault_sig|REQUEST_HEADERS:X-Forwarded-For|REQUEST_HEADERS:X-Original-URL|ARGS:sim_exploit "@rx (^(true|TRUE|admin|ADMIN|low|medium|high)$|dXNlcj1hZG1pbg==|127\.0\.0\.1|/admin/vault|52c876f2a69205692536a1f2857b4e4c70312142b068e23f4d87d506680183c5)" "id:1003,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-VAULT-BASIC',tag:'Access Control',severity:'CRITICAL'"

# WAF-FORCED-BROWSING-ADMIN (Forced Browsing - L1)
SecRule REQUEST_URI "@rx (?i)(/admin-console|/secret-backup|/admin_panel|/faculty-console)" "id:1030,phase:2,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-FORCED-BROWSING-ADMIN',tag:'Forced Browsing',severity:'CRITICAL'"

# WAF-IDOR-DEAN-DOSSIER (IDOR - L1)
SecRule ARGS:student_id|REQUEST_URI "@rx (?i)(\bstudent_id=1\b|^1$)" "id:1043,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-IDOR-DEAN-DOSSIER',tag:'IDOR',severity:'CRITICAL'"
