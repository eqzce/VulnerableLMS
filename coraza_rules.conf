# WAF-RCE-SHELL-BINARIES (RCE - L1)
SecRule ARGS "@rx (?i)(/bin/(bash|sh|zsh|dash)|/usr/bin/id|/usr/bin/whoami|cmd\.exe|powershell(\.exe)?|nc\s+-e)" "id:932100,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-RCE-SHELL-BINARIES',tag:'RCE',severity:'CRITICAL'"

# WAF-RCE-WINDOWS-LOLBINS (RCE - L1)
SecRule ARGS "@rx (?i)\b(certutil|bitsadmin|vssadmin|wmic|curl\s+.*\|\s*sh|wget\s+.*\|\s*sh)\b" "id:932110,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-RCE-WINDOWS-LOLBINS',tag:'RCE',severity:'CRITICAL'"

# WAF-PHP-CODE-EXECUTION (Code Injection - L1)
SecRule ARGS "@rx (?i)(<\?php|\b(eval|assert|passthru|shell_exec|proc_open)\s*\()" "id:933100,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-PHP-CODE-EXECUTION',tag:'Code Injection',severity:'CRITICAL'"

# WAF-SSTI-TEMPLATE-INJECTION (Code Injection - L1)
