# ======================================================================
# OWASP CORAZA WAF — MODSECURITY SECLANG CONFIGURATION (AUTO-GENERATED)
# Active Mode: SecRuleEngine DetectionOnly | Active Paranoia Level: L1
# ======================================================================
SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecAuditEngine Off
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog c:/Users/Ersultan/Desktop/WebSec/moodle_portal/coraza_audit.log

# Whitelist WAF Admin Dashboard, Hints & Settings endpoints
SecRule REQUEST_URI "@rx ^/(waf-dashboard|waf/|settings/|hints|coraza-blocked)" "id:999,phase:1,pass,nolog,ctl:ruleEngine=Off"
# Only evaluate Access Control cookie/header rules on POST requests so GET page loads are never locked out by stale cookies
SecRule REQUEST_METHOD "@streq GET" "id:998,phase:1,pass,nolog,ctl:ruleRemoveById=1003,ctl:ruleRemoveById=1031,ctl:ruleRemoveById=2003,ctl:ruleRemoveById=2031"

# WAF-SQLI-BASIC (SQLi - L1)
SecRule ARGS "@rx (?i)(union\s+select|or\s+['\x22]?\d+['\x22]?\s*=\s*['\x22]?\d+|/\*\*/\s*or\s*/\*\*/|'and'1'='1|drop\s+table|--)" "id:1001,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-SQLI-BASIC',tag:'SQLi',severity:'CRITICAL'"

# WAF-XSS-BASIC (XSS - L1)
SecRule ARGS "@rx (?i)(<\s*script\b|javascript\s*:|<\s*iframe\b|<\s*object\b|<\s*embed\b|<\s*img\b|\bonerror\s*=|<\s*details\b|\bontoggle\s*=)" "id:1002,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-XSS-BASIC',tag:'XSS',severity:'CRITICAL'"

# WAF-BAC-BASIC (Access Control - L1)
SecRule ARGS:is_admin|REQUEST_COOKIES:user_role|REQUEST_COOKIES:auth_token|REQUEST_COOKIES:vault_sig|REQUEST_HEADERS:X-Forwarded-For|REQUEST_HEADERS:X-Original-URL|ARGS:sim_exploit "@rx (^(true|TRUE|admin|ADMIN|low|medium|high)$|dXNlcj1hZG1pbg==|127\.0\.0\.1|/admin/vault|52c876f2a69205692536a1f2857b4e4c70312142b068e23f4d87d506680183c5)" "id:1003,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-BAC-BASIC',tag:'Access Control',severity:'CRITICAL'"

# WAF-SQLI-STACKED-QUERIES (SQLi - L1)
SecRule ARGS "@rx (?i);\s*(insert|update|delete|drop|alter|create|truncate)\s+" "id:1011,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-SQLI-STACKED-QUERIES',tag:'SQLi',severity:'CRITICAL'"

# WAF-SQLI-METADATA-PROBING (SQLi - L1)
SecRule ARGS "@rx (?i)\b(information_schema|sqlite_master|sqlite_temp_master|pg_tables|sys\.databases)\b" "id:1012,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-SQLI-METADATA-PROBING',tag:'SQLi',severity:'CRITICAL'"

# WAF-XSS-DATA-SCHEME (XSS - L1)
SecRule ARGS "@rx (?i)data:text/(html|javascript)" "id:1021,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-XSS-DATA-SCHEME',tag:'XSS',severity:'CRITICAL'"

# WAF-XSS-STYLE-EXPRESSION (XSS - L1)
SecRule ARGS "@rx (?i)(style\s*=.*expression\s*\(|vbscript\s*:)" "id:1022,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-XSS-STYLE-EXPRESSION',tag:'XSS',severity:'CRITICAL'"

# WAF-BAC-PRIVILEGE-ESCALATION (Access Control - L1)
SecRule ARGS|REQUEST_COOKIES "@rx (?i)\b(role=(root|superuser|administrator)|admin=1|is_staff=true|is_dean=true)\b" "id:1031,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-BAC-PRIVILEGE-ESCALATION',tag:'Access Control',severity:'CRITICAL'"

# WAF-SCANNER-USERAGENT (Scanner Detection - L1)
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|acunetix|dirbuster|gobuster|wpscan|havij|nessus|masscan|zgrab|openvas|arachni)" "id:913100,phase:2,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-SCANNER-USERAGENT',tag:'Scanner Detection',severity:'CRITICAL'"

# WAF-SCANNER-VULN-PROBES (Scanner Detection - L1)
SecRule ARGS|REQUEST_URI "@rx (?i)(acunetix_wvs|nessus_token|appscan_probe|openvas_scan)" "id:913110,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-SCANNER-VULN-PROBES',tag:'Scanner Detection',severity:'CRITICAL'"

# WAF-PROTOCOL-INVALID-METHOD (Protocol Enforcement - L1)
SecRule REQUEST_METHOD "@rx (?i)^(PUT|DELETE|CONNECT|TRACE|TRACK)$" "id:920100,phase:2,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-PROTOCOL-INVALID-METHOD',tag:'Protocol Enforcement',severity:'CRITICAL'"

# WAF-PROTOCOL-HTTP-SPLITTING (Protocol Enforcement - L1)
SecRule ARGS|REQUEST_HEADERS "@rx (?i)(%0d%0a|\r\n)(set-cookie|location|content-type):" "id:921110,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-PROTOCOL-HTTP-SPLITTING',tag:'Protocol Enforcement',severity:'CRITICAL'"

# WAF-LFI-PATH-TRAVERSAL (LFI / Path Traversal - L1)
SecRule ARGS|REQUEST_URI "@rx (?i)(\.\./|\.\.\\|/etc/passwd|/etc/shadow|c:\\windows|c:/windows|boot\.ini|win\.ini|secret_exam_key)" "id:930100,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-LFI-PATH-TRAVERSAL',tag:'LFI / Path Traversal',severity:'CRITICAL'"

# WAF-LFI-NULL-BYTE (LFI / Path Traversal - L1)
SecRule ARGS|REQUEST_URI "@rx (?i)(%00|\\x00|%2500)" "id:930110,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-LFI-NULL-BYTE',tag:'LFI / Path Traversal',severity:'CRITICAL'"

# WAF-LFI-SENSITIVE-FILES (LFI / Path Traversal - L1)
SecRule ARGS:doc|REQUEST_URI "@rx (?i)(secret_exam_key|credentials|\.env|\.git)" "id:930120,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-LFI-SENSITIVE-FILES',tag:'LFI / Path Traversal',severity:'CRITICAL'"

# WAF-FORCED-BROWSING-ADMIN (Forced Browsing / URL Access - L1)
SecRule REQUEST_URI "@rx (?i)(/admin-console|/secret-backup|/admin_panel|/faculty-console)" "id:930130,phase:2,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-FORCED-BROWSING-ADMIN',tag:'Forced Browsing / URL Access',severity:'CRITICAL'"

# WAF-RFI-REMOTE-INCLUDE (RFI - L1)
SecRule ARGS "@rx (?i)(https?|ftp|file)://" "id:931100,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-RFI-REMOTE-INCLUDE',tag:'RFI',severity:'CRITICAL'"

# WAF-PHP-STREAM-WRAPPERS (RFI - L1)
