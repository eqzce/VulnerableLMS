# WAF-SSRF-LOOPBACK (SSRF - L1)
SecRule ARGS:url|ARGS:target|REQUEST_URI "@rx (?i)(127\.0\.0\.1|localhost|0\.0\.0\.0|169\.254\.169\.254|metadata\.google\.internal)" "id:934100,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-SSRF-LOOPBACK',tag:'SSRF',severity:'CRITICAL'"

# WAF-IDOR-NUMERIC-OBJECT (IDOR - L1)
SecRule ARGS:student_id|REQUEST_URI "@rx (?i)(\bstudent_id=1\b|^1$)" "id:943200,phase:2,t:urlDecodeUni,pass,log,auditlog,ctl:auditEngine=On,msg:'WAF-IDOR-NUMERIC-OBJECT',tag:'IDOR',severity:'CRITICAL'"

# WAF-LOG4J-JNDI-INJECTION (Deserialization / RCE - L1)
