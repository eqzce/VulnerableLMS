# ======================================================================
# OWASP CORAZA WAF — OFFICIAL CORE RULE SET (CRS v4.10.0) CONFIGURATION
# Active Mode: SecRuleEngine On | Active Paranoia Level: L2
# ======================================================================
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess On
SecAuditEngine RelevantOnly
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog ./coraza_audit.log

# 1. Whitelist WAF Admin Dashboard, Hints, Settings & Blocked endpoints
SecRule REQUEST_URI "@rx ^/(waf-dashboard|waf/|settings/|hints|coraza-blocked|static/)" "id:999,phase:1,pass,nolog,ctl:ruleEngine=Off"

# 2. Include Official OWASP ModSecurity Core Rule Set Setup (CRS v4.10.0)
Include ./owasp-crs/crs-setup.conf

# 3. Configure Dynamic Paranoia Level & Inbound Anomaly Threshold (Overrides crs-setup.conf)
SecAction "id:900000,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.10.0',setvar:tx.blocking_paranoia_level=2"
SecAction "id:900001,phase:1,pass,t:none,nolog,setvar:tx.inbound_anomaly_score_threshold=5"

# 4. Include Official OWASP Core Rule Set Modules (*.conf)
Include ./owasp-crs/rules/*.conf

# 5. Local Lab Compatibility & Dynamic Tuning (Must follow CRS Include)
# Disable rule 920350 so connecting via 127.0.0.1 never triggers IP-host warning
SecRuleUpdateTargetById 920350 "!REQUEST_HEADERS:Host"

# 6. University Virtual Patching Rules (Business Logic Protection)
# Only evaluate Access Control cookie/header rules on POST requests so GET page loads are never locked out by stale cookies
SecRule REQUEST_METHOD "@streq GET" "id:998,phase:1,pass,nolog,ctl:ruleRemoveById=1003,ctl:ruleRemoveById=2003"

# WAF-SQLI-BASIC (SQLi - L1)
SecRule ARGS "@rx (?i)(union\s+select|or\s+['\x22]?\d+['\x22]?\s*=\s*['\x22]?\d+|/\*\*/\s*or\s*/\*\*/|'and'1'='1|drop\s+table|--\s*$)" "id:1001,phase:2,t:none,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-SQLI-BASIC',tag:'SQLi',severity:'CRITICAL'"

# WAF-XSS-BASIC (XSS - L1)
SecRule ARGS "@rx (?i)(<\s*script\b|javascript\s*:|<\s*iframe\b|<\s*object\b|<\s*embed\b|<\s*img\b|\bonerror\s*=|<\s*details\b|\bontoggle\s*=)" "id:1002,phase:2,t:none,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-XSS-BASIC',tag:'XSS',severity:'CRITICAL'"

# WAF-VAULT-BASIC (Access Control - L1)
SecRule ARGS:is_admin|REQUEST_COOKIES:user_role|REQUEST_COOKIES:auth_token|REQUEST_COOKIES:vault_sig|REQUEST_HEADERS:X-Forwarded-For|REQUEST_HEADERS:X-Original-URL|ARGS:sim_exploit "@rx (^(true|TRUE|admin|ADMIN|low|medium|high)$|dXNlcj1hZG1pbg==|127\.0\.0\.1|/admin/vault|52c876f2a69205692536a1f2857b4e4c70312142b068e23f4d87d506680183c5)" "id:1003,phase:2,t:none,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-VAULT-BASIC',tag:'Access Control',severity:'CRITICAL'"

# WAF-RCE-CHAINING (RCE - L1)
SecRule ARGS:ip|ARGS:command|ARGS "@rx (?i)[;&|]\s*whoami" "id:1004,phase:2,t:none,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-RCE-CHAINING',tag:'RCE',severity:'CRITICAL'"

# WAF-LFI-BASIC (LFI - L1)
SecRule QUERY_STRING "@rx (?i)(doc=secret_exam_key\.txt(&|$)|(?:\.\./|\.\.\\))" "id:1005,phase:2,t:none,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-LFI-BASIC',tag:'LFI',severity:'CRITICAL'"

# WAF-SSRF-LOOPBACK (SSRF - L1)
SecRule ARGS:url|ARGS "@rx (?i)https?://(?:127\.0\.0\.1|localhost|2130706433|0x7f000001)(?::\d+)?" "id:1006,phase:2,t:none,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-SSRF-LOOPBACK',tag:'SSRF',severity:'CRITICAL'"

# WAF-FORCED-BROWSING-ADMIN (Forced Browsing - L1)
SecRule REQUEST_URI "@rx (?i)/portal/(?:%61|a)dmin-console|(?i)(/secret-backup|/admin_panel|/faculty-console)" "id:1030,phase:2,t:none,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-FORCED-BROWSING-ADMIN',tag:'Forced Browsing',severity:'CRITICAL'"

# WAF-IDOR-DEAN-DOSSIER (IDOR - L1)
SecRule ARGS:student_id|REQUEST_URI "@rx (?i)(\bstudent_id=1\b|^1$)" "id:1043,phase:2,t:none,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-IDOR-DEAN-DOSSIER',tag:'IDOR',severity:'CRITICAL'"

# WAF-CSRF-ANOMALOUS-ORIGIN (CSRF - L1)
SecRule REQUEST_HEADERS:Referer|ARGS:email|ARGS:sim_csrf "@rx (?i)(attacker\.com|attacker@evil\.com|attacker_referer|attacker_header|^(low|medium|high)$)" "id:1049,phase:2,t:none,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-CSRF-ANOMALOUS-ORIGIN',tag:'CSRF',severity:'CRITICAL'"

# WAF-SQLI-BYPASS (SQLi - L2)
SecRule ARGS "@rx (?i)(/\*.*\*/|'\s*(or|and)\s*'[a-z0-9]+'\s*=\s*'|['\x22]\s*(or|and)\s*[a-z0-9]+\s*=\s*[a-z0-9]+|--|;\s*(drop|select|insert|update))" "id:2001,phase:2,t:urlDecodeUni,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-SQLI-BYPASS',tag:'SQLi',severity:'CRITICAL'"

# WAF-XSS-BYPASS (XSS - L2)
SecRule ARGS "@rx (?i)(\bon[a-z]+\s*=|<\s*(svg|img|body|details|input|video|audio|marquee|object|embed)\b|autofocus)" "id:2002,phase:2,t:urlDecodeUni,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-XSS-BYPASS',tag:'XSS',severity:'CRITICAL'"

# WAF-VAULT-BYPASS (Access Control - L2)
SecRule REQUEST_COOKIES:auth_token|REQUEST_COOKIES:vault_sig|REQUEST_HEADERS:X-Forwarded-For|REQUEST_HEADERS:X-Original-URL|ARGS:sim_exploit "@rx (?i)(dXNlcj1hZG1pbg==|dXNlcj1BRE1JTg==|localhost|127\.0\.0\.1|/admin|52c876f2a69205692536a1f2857b4e4c70312142b068e23f4d87d506680183c5|^bypass$)" "id:2003,phase:2,t:urlDecodeUni,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-VAULT-BYPASS',tag:'Access Control',severity:'CRITICAL'"

# WAF-RCE-OBFUSCATED (RCE - L2)
SecRule ARGS:ip|ARGS:command|ARGS "@rx (?i)[;&|]\s*[w'\\x22`]+[h'\\x22`]+[o'\\x22`]+[a'\\x22`]+[m'\\x22`]+[i'\\x22`]+" "id:2004,phase:2,t:urlDecodeUni,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-RCE-OBFUSCATED',tag:'RCE',severity:'CRITICAL'"

# WAF-LFI-BYPASS (LFI - L2)
SecRule QUERY_STRING|ARGS:doc|ARGS "@rx (?i)(%2e%2e|%2f|%5c|\.\.|secret_exam_key)" "id:2005,phase:2,t:urlDecodeUni,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-LFI-BYPASS',tag:'LFI',severity:'CRITICAL'"

# WAF-SSRF-IPV6-OCTAL (SSRF - L2)
SecRule ARGS:url|ARGS "@rx (?i)https?://(?:\[::1\]|0177\.0\.0\.1|0x7f|2130706433|127\.|localhost)" "id:2006,phase:2,t:urlDecodeUni,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-SSRF-IPV6-OCTAL',tag:'SSRF',severity:'CRITICAL'"

# WAF-FORCED-BROWSING-NORMALIZATION (Forced Browsing - L2)
SecRule REQUEST_URI "@rx (?i)(/portal/faculty/|%2e%2e|\.\./|\.\.\\)" "id:2030,phase:2,t:urlDecodeUni,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-FORCED-BROWSING-NORMALIZATION',tag:'Forced Browsing',severity:'CRITICAL'"

# WAF-CSRF-BYPASS (CSRF - L2)
SecRule ARGS:email|REQUEST_URI "@rx (?i)(evil\.com|attacker_bypass)" "id:2049,phase:2,t:urlDecodeUni,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'WAF-CSRF-BYPASS',tag:'CSRF',severity:'CRITICAL'"
